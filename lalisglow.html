<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Oficial - Lalis Glow</title>
  <style>
    :root {
      --primary: #4a1525;
      --primary-dark: #320e19;
      --accent: #d4af37;
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #2c2c2c;
      --text-light: #777777;
      --border: #e6dfd5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 1.5rem; letter-spacing: 1px; }
    header p { font-size: 0.85rem; color: #dcd6d0; margin-top: 3px; }

    .search-bar-container {
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }
    .search-input {
      width: 100%;
      max-width: 600px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.95rem;
      outline: none;
      background: #faf8f5;
    }
    .search-input:focus { border-color: var(--accent); background: white; }

    .filters {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: #f4f0eb;
      border: none;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      background: #f7f5f0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img .ph { font-size: 2rem; color: #ccc; }

    .stock-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 10px;
      backdrop-filter: blur(2px);
    }
    .stock-badge.ago { background: #c0392b; }

    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-cat { font-size: 0.65rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .card-name { font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; height: 2.4em; }
    .card-prices { margin-top: auto; margin-bottom: 8px; }
    .price-d { font-size: 0.95rem; font-weight: 700; color: var(--primary); display: block; }
    .price-m { font-size: 0.75rem; color: var(--text-light); }

    .add-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-btn:hover { background: var(--primary-dark); }
    .add-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* MODAL */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
      padding: 15px;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: white; width: 100%; max-width: 450px; border-radius: 12px;
      overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform: translateY(20px); transition: transform 0.3s;
      max-height: 90vh; display: flex; flex-direction: column;
    }
    .overlay.open .modal { transform: translateY(0); }

    .modal-header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1rem; }
    .close-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }

    .modal-body { padding: 15px; overflow-y: auto; flex-grow: 1; }
    .modal-img-container { width: 100%; aspect-ratio: 1; background: #f9f9f9; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
    .modal-img-container img { width: 100%; height: 100%; object-fit: contain; }

    /* MINIATURAS DE VARIANTES */
    .var-section { margin-bottom: 12px; }
    .var-title { font-size: 0.8rem; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
    .var-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .var-thumb { width: 45px; height: 45px; border-radius: 6px; border: 2px solid var(--border); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
    .var-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .var-thumb.sel { border-color: var(--accent); box-shadow: 0 0 5px rgba(212,175,55,0.5); }
    .vph { font-size: 1rem; color: #999; }

    .modal-details { margin-bottom: 15px; }
    .m-cat { font-size: 0.7rem; color: var(--text-light); text-transform: uppercase; }
    .m-name { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .m-prices { background: #fdfbf7; padding: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mp-item span { display: block; font-size: 0.7rem; color: var(--text-light); }
    .mp-item strong { font-size: 1rem; color: var(--primary); }
    .m-hint { font-size: 0.75rem; color: #27ae60; background: #e8f8f0; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }

    .qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .qty-controls { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .qty-btn { background: #f4f0eb; border: none; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
    .qty-val { width: 40px; text-align: center; font-size: 0.9rem; font-weight: 600; }

    .modal-footer { padding: 12px 15px; background: #faf8f5; border-top: 1px solid var(--border); }
    .modal-add-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }

    /* CARRITO FLOTANTE */
    .cart-float { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 900; font-weight: 600; }
    .cart-badge { background: var(--accent); color: var(--primary-dark); padding: 2px 7px; border-radius: 10px; font-size: 0.8rem; }

    /* PANEL CARRITO */
    .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }
    .cart-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 380px; height: 100%; background: white; z-index: 1200; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease; display: flex; flex-direction: column; }
    .cart-panel.open { right: 0; }
    .cp-header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .cp-body { padding: 15px; overflow-y: auto; flex-grow: 1; }
    .cart-empty { text-align: center; color: var(--text-light); margin-top: 50px; }
    .cart-empty .ico { font-size: 3rem; margin-bottom: 10px; }
    
    .ci { display: flex; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); align-items: center; }
    .ci img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .ci-info { flex-grow: 1; }
    .ci-name { font-size: 0.8rem; font-weight: 600; line-height: 1.1; margin-bottom: 2px; }
    .ci-var { font-size: 0.7rem; color: var(--text-light); }
    .ci-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .ci-qb { background: #f4f0eb; border: none; width: 20px; height: 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .ci-q { font-size: 0.8rem; font-weight: 600; }
    .ci-p { font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-left: auto; }
    .ci-del { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 0.9rem; padding: 5px; }

    .cp-footer { padding: 15px; background: #faf8f5; border-top: 1px solid var(--border); }
    .cp-tot-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 1rem; }
    .cp-not { font-size: 0.75rem; color: var(--text-light); margin-bottom: 10px; text-align: center; }
    .send-wa-btn { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; }
    .send-wa-btn:disabled { background: #ccc; cursor: not-align; }

    /* FORMULARIO DATOS */
    .form-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 15px; }
    .form-overlay.open { opacity: 1; pointer-events: auto; }
    .form-box { background: white; width: 100%; max-width: 400px; border-radius: 10px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    .form-box h3 { margin-bottom: 15px; font-size: 1rem; color: var(--primary); }
    .fg { margin-bottom: 10px; }
    .fg label { display: block; font-size: 0.75rem; color: var(--text-light); margin-bottom: 3px; }
    .fg input, .fg select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none; }
    .form-btns { display: flex; gap: 10px; margin-top: 15px; }
    .send-btn { background: #25d366; color: white; border: none; padding: 10px; border-radius: 6px; flex-grow: 1; font-weight: 600; cursor: pointer; }
    .cancel-btn { background: #e0e0e0; color: var(--text); border: none; padding: 10px; border-radius: 6px; cursor: pointer; }

    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2c2c2c; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; z-index: 1500; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253,251,247,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Cargando catálogo...</p>
  </div>

  <header>
    <h1>Lalis Glow</h1>
    <p>Catálogo Oficial</p>
  </header>

  <div class="search-bar-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar producto o referencia...">
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('TODOS', this)">✨ Todos</button>
    <button class="filter-btn" onclick="setFilter('MAQUILLAJE', this)">💄 Maquillaje</button>
    <button class="filter-btn" onclick="setFilter('FRAGANCIAS', this)">🌸 Fragancias</button>
    <button class="filter-btn" onclick="setFilter('RELOJES', this)">⏰ Relojes</button>
    <button class="filter-btn" onclick="setFilter('CUIDADO PERSONAL', this)">🧴 Cuidado Personal</button>
    <button class="filter-btn" onclick="setFilter('ACCESORIOS', this)">👜 Accesorios</button>
  </div>

  <div class="container">
    <div id="grid" class="grid"></div>
    <div id="noRes" style="display:none; text-align:center; padding:40px; color:var(--text-light);">
      <p>No se encontraron productos.</p>
    </div>
  </div>

  <!-- VENTANA MODAL -->
